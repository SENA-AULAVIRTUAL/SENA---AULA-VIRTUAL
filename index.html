<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENA AULA VIRTUAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}body{background:#0a2e00;display:flex;justify-content:center;padding:20px;min-height:100vh}
.card{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:30px;text-align:center;border-top:8px solid #39A900}
.logo{width:100px;margin:auto;display:block}h1{color:#39A900;font-weight:900;margin:10px 0}.btn{width:100%;padding:16px;margin-top:12px;border:none;border-radius:12px;font-weight:900;cursor:pointer;font-size:16px}
.btn-green{background:#39A900;color:#fff}.btn-white{background:#fff;color:#39A900;border:2px solid #39A900}
input{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;margin-top:10px;text-align:center;font-weight:700}
</style></head><body>
<div class="card" id="app">
<img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/8/83/Sena_Colombia_logo.svg">
<h1>SENA<br>AULA VIRTUAL</h1><p>Centro Colombo Alemán</p>
<button class="btn btn-green" onclick="showInstructor()">SOY INSTRUCTOR</button>
<button class="btn btn-white" onclick="showAprendiz()">SOY APRENDIZ</button>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw21TnLVgecMZVQMBWD17LxGt2Z69fEz68WxUFoeLMC_hEs41GhG_lfMvSjM7B2oouc/exec";
function showInstructor(){
 document.getElementById('app').innerHTML=`<h1>INSTRUCTOR</h1><input id="f" placeholder="Ficha Ej: 3410389"><input id="p" type="password" placeholder="Contraseña SENA2026"><button class="btn btn-green" onclick="loginInst()">ENTRAR</button><br><br><a href="#" onclick="location.reload()">Volver</a>`;
}
function showAprendiz(){
 document.getElementById('app').innerHTML=`<h1>APRENDIZ</h1><input id="f" placeholder="Escribe tu ficha"><button class="btn btn-green" onclick="loginApr()">VER MI PLAN</button><br><br><a href="#" onclick="location.reload()">Volver</a>`;
}
async function loginInst(){
 const f=document.getElementById('f').value, p=document.getElementById('p').value;
 const r=await fetch(`${API_URL}?action=loginInstructor&ficha=${f}&pass=${p}`); const j=await r.json();
 if(j.ok){ localStorage.setItem('fichaInst',f); location.href='instructor.html'; } else alert('Ficha o contraseña mal');
}
function loginApr(){ const f=document.getElementById('f').value; if(!f)return; location.href=`ficha.html?ficha=${f}`; }
</script></body></html>
