<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENA AULA VIRTUAL - Centro Colombo Alemán</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}
body{background:#2e7d32}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#39A900,#4caf50);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{width:420px;max-width:100%;background:#fff;border-radius:22px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.logo{width:95px;margin:0 auto;display:block}
h1{font-size:20px;color:#222;margin-top:10px;font-weight:900}
.sub{font-size:11px;color:#666;margin:4px 0 0}
.sub2{font-size:10px;color:#39A900;font-weight:800;letter-spacing:.5px;margin-top:6px}
.label{text-align:left;font-size:12px;font-weight:800;color:#39A900;margin:16px 0 5px}
.input{width:100%;padding:13px 14px;border:2px solid #dcedc8;border-radius:12px;font-size:13px}
.input:focus{border-color:#39A900;outline:none}
.btn{width:100%;padding:14px;background:#39A900;color:#fff;border:none;border-radius:14px;font-weight:900;font-size:14px;margin-top:18px;cursor:pointer}
.btn:hover{background:#2d8600}
#app{display:none}
.header{height:70px;background:#39A900;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 16px;position:sticky;top:0}
.box{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
</style>
</head>
<body>

<!-- ACCESO UNICO FINAL - SENA AULA VIRTUAL -->
<div id="login">
 <div class="card">
  <img class="logo" src="logo-verde.png" alt="SENA">
  <h1>SENA<br>AULA VIRTUAL</h1>
  <p class="sub">CENTRO COLOMBO ALEMÁN</p>
  <p style="font-size:11px;color:#555;margin-top:10px">Ficha 3410389 - Producción Componentes Mecánicos CNC<br>Aula CAD-CAM 11:30am-6:30pm - Omar Pardey</p>

  <div class="label">Numero de Documento</div>
  <input id="doc" class="input" placeholder="Ingrese su número de documento">

  <div class="label">Ficha</div>
  <input id="ficha" class="input" value="3410389" placeholder="3410389">

  <button class="btn" onclick="entrar()">ENTRAR A MI AULA VIRTUAL →</button>
  <p id="msg" style="font-size:11px;color:#c62828;margin-top:10px;min-height:14px"></p>
 </div>
</div>

<!-- DASHBOARD DESPUES DE ENTRAR -->
<div id="app">
 <div class="header"><div style="display:flex;gap:8px;align-items:center"><img src="logo-verde.png" style="width:38px;background:#fff;border-radius:8px;padding:3px"><b>SENA AULA VIRTUAL</b></div><div style="display:flex;gap:10px;align-items:center"><span id="semaTop" style="background:#fff;color:#2e7d32;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px">-</span><button onclick="localStorage.clear();location.reload()" style="background:#fff;border:none;padding:6px 10px;border-radius:20px;font-size:10px;font-weight:800">Salir</button></div></div>
 <div style="max-width:1100px;margin:12px auto;padding:0 12px">
  <div class="box"><h2 id="bien">Bienvenido</h2><p id="det" style="font-size:12px;color:#555"></p></div>
  <div style="display:grid;grid-template-columns:1.2fr.8fr;gap:12px">
   <div class="box"><h3>📅 Calendario - Faltas</h3><div id="cal" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;margin-top:10px"></div></div>
   <div><div class="box" style="border-left:5px solid #39A900"><h3>🚦 Semáforo Por Fuera</h3><div id="semaDet" style="margin-top:8px;padding:10px;background:#f1f8e9;border-radius:10px;font-size:12px"></div></div><div class="box" style="border:2px dashed #f9a825"><h3>📁 Carpeta Única: Registro de Ausencias</h3><div id="carp"></div><ul id="listF" style="padding:0"></ul><p id="totF" style="font-weight:900;margin-top:8px;font-size:12px"></p></div></div>
  </div>
 </div>
</div>

<script>
const FILE="1lzrJLYzG11KVNdfFIcOgCjaJzFX2z96EhHjbveNJUX8", PUB="2PACX-1vTdcStJvMC8Ggfh-Y4BBWp2IvXmINK64xCp5ZOf5N7ev9_J3t3OFWiQcVmllElwf6EjM8MuIStF7ZDu";
const UR="https://docs.google.com/spreadsheets/d/"+FILE+"/gviz/tq?tqx=out:csv&sheet=RESUMEN_WEB", UA="https://docs.google.com/spreadsheets/d/"+FILE+"/gviz/tq?tqx=out:csv&sheet=ASISTENCIA", UP="https://docs.google.com/spreadsheets/d/e/"+PUB+"/pub?output=csv";
async function get(u){try{let r=await fetch(u,{cache:"no-store"});if(r.ok)return await r.text()}catch(e){}return""}
async function entrar(){
 let d=document.getElementById("doc").value.trim(), f=document.getElementById("ficha").value.trim(), m=document.getElementById("msg");
 if(!d||!f){m.innerText="Ingresa documento y ficha";return}
 m.innerText="Verificando..."; let csv=await get(UR); if(!csv) csv=await get(UP);
 if(!csv.includes(d)){m.innerText="Documento no encontrado en 3410389";return}
 if(!csv.includes(f)){m.innerText="Ficha debe ser 3410389";return}
 localStorage.setItem("doc",d); localStorage.setItem("fic",f);
 document.getElementById("login").style.display="none"; document.getElementById("app").style.display="block"; cargar(d,f);
}
async function cargar(doc,fic){
 let csvR=await get(UR); if(!csvR) csvR=await get(UP); let csvA=await get(UA);
 let fila=csvR.split("\n").find(l=>l.includes(doc)); let fall=0,est="VERDE",nom="Aprendiz";
 if(fila){let p=fila.split(",").map(s=>s.replace(/"/g,"").trim()); nom=p[1]||"Aprendiz"; fall=p[3]||0; est=(p[4]||"VERDE").toUpperCase()}
 document.getElementById("bien").innerText="Bienvenido, "+nom.split(" ")[0]; document.getElementById("det").innerText="Centro Colombo Alemán - Ficha "+fic+" - Fallas: "+fall+" - "+est;
 let top=document.getElementById("semaTop"); if(est.includes("VERDE")){top.innerText="🟢 VERDE"} else if(est.includes("AMARILLO")){top.innerText="🟡 AMARILLO "+fall} else{top.innerText="🔴 ROJO "+fall}
 document.getElementById("semaDet").innerHTML="<b>"+est+"</b><br>Fallas: "+fall+"<br>Horario: 11:30-18:30 Aula CAD-CAM";
 if(csvA){let ls=csvA.split("\n"), hs=ls[0].split(",").map(h=>h.replace(/"/g,"").trim()), fa=ls.find(l=>l.includes(doc)); if(fa){let vs=fa.split(",").map(v=>v.replace(/"/g,"").trim()), falt=[]; for(let i=3;i<vs.length;i++){if(vs[i].toUpperCase()=="F") falt.push(hs[i])}
  let c=document.getElementById("carp"), l=document.getElementById("listF"); if(falt.length==0){c.innerHTML="<p style='color:#2e7d32'>✅ Sin faltas</p>"; l.innerHTML=""} else{c.innerHTML="Días que no asististe:"; l.innerHTML=falt.map(x=>"<li style='list-style:none;margin:5px 0'>🔴 <b>"+x+"</b></li>").join("")}
  document.getElementById("totF").innerText="Total: "+falt.length+" días • "+est;
  let cal=document.getElementById("cal"), ds=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"], h=ds.map(d=>"<div style='background:#39A900;color:#fff;padding:6px;border-radius:6px;font-weight:800'>"+d+"</div>").join(""); for(let i=1;i<=31;i++){let isF=false; for(let f of falt){let n=parseInt((f.match(/\d+/)||[0])[0]); if(n==i) isF=true} h+="<div style='padding:6px;border-radius:6px;"+(isF?"background:#ffcdd2;color:#b71c1c;font-weight:900":"")+"'>"+i+"</div>"} cal.innerHTML=h;
 }}
}
window.onload=async()=>{let d=localStorage.getItem("doc"), f=localStorage.getItem("fic"); if(d&&f){document.getElementById("doc").value=d; document.getElementById("ficha").value=f; document.getElementById("login").style.display="none"; document.getElementById("app").style.display="block"; cargar(d,f)}}
</script>
</body>
</html>
